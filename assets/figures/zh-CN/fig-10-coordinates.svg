  <rect width="680" height="420" fill="#fafafa"/>
  <text x="40" y="28" font-family="-apple-system,PingFang SC,sans-serif" font-size="14" font-weight="500" fill="#222">图10 浮动坐标与工件坐标（示意）</text>
  <text x="640" y="28" text-anchor="end" font-family="-apple-system,sans-serif" font-size="11" fill="#888">示意 · 非软件截图</text>
  
  <line x1="80" y1="280" x2="600" y2="280" stroke="#666" stroke-width="1.5"/>
  <line x1="80" y1="280" x2="80" y2="60" stroke="#666" stroke-width="1.5"/>
  <text x="610" y="285" font-size="11">X</text>
