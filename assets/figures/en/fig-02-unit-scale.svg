<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420">
  <rect width="680" height="420" fill="#fafafa"/>
  <text x="40" y="28" font-family="-apple-system,PingFang SC,sans-serif" font-size="14" font-weight="500" fill="#222">Fig 2 Units and scale (diagram)</text>
  <text x="640" y="28" text-anchor="end" font-family="-apple-system,sans-serif" font-size="11" fill="#888">Diagram · not a screenshot</text>
  
  <text x="40" y="60" font-size="12">Correct: units mm, rect 80×40</text>
  <rect x="40" y="80" width="160" height="80" fill="none" stroke="#1a73e8" stroke-width="2"/>
  <text x="120" y="125" text-anchor="middle" font-size="12" fill="#1a73e8">80 × 40 mm</text>
  <text x="280" y="60" font-size="12">Wrong: reading as inch inflates 25.4×</text>
  <rect x="280" y="80" width="200" height="200" fill="none" stroke="#d93025" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="380" y="185" text-anchor="middle" font-size="12" fill="#d93025">2032 × 1016 mm (wrong)</text>
  <text x="40" y="300" font-size="12" fill="#444">Measure outline after import; if wrong check units before nesting.</text>
  <text x="40" y="330" font-size="11" fill="#888">Diagram: scale exaggerated for clarity</text>

</svg>
