<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420">
  <rect width="680" height="420" fill="#fafafa"/>
  <text x="40" y="28" font-family="-apple-system,PingFang SC,sans-serif" font-size="14" font-weight="500" fill="#222">Fig 9 Sorting rules (diagram)</text>
  <text x="640" y="28" text-anchor="end" font-family="-apple-system,sans-serif" font-size="11" fill="#888">Diagram · not a screenshot</text>
  
  <rect x="40" y="55" width="280" height="200" fill="#f5f5f5" stroke="#ccc"/>
  <text x="180" y="48" text-anchor="middle" font-size="12">Wrong order: outer first</text>
  <rect x="70" y="80" width="100" height="80" fill="none" stroke="#d93025" stroke-width="2"/>
  <circle cx="120" cy="120" r="25" fill="none" stroke="#d93025" stroke-dasharray="3 2"/>
  <text x="120" y="220" text-anchor="middle" font-size="11" fill="#d93025">1 outer → 2 inner (holes may drop under skeleton)</text>
  <rect x="360" y="55" width="280" height="200" fill="#f5f5f5" stroke="#ccc"/>
  <text x="500" y="48" text-anchor="middle" font-size="12">Correct: inner first, outer last</text>
  <circle cx="460" cy="120" r="25" fill="none" stroke="#0d904f" stroke-width="2"/>
  <rect x="410" y="80" width="100" height="80" fill="none" stroke="#0d904f" stroke-width="2"/>
  <text x="500" y="220" text-anchor="middle" font-size="11" fill="#0d904f">1 hole → 2 outer</text>
  <text x="40" y="310" font-size="12">On nests also reduce rapids and heat load. Auto-sort then human-check order.</text>

</svg>
