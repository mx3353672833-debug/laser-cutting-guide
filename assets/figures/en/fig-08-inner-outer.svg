<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420">
  <rect width="680" height="420" fill="#fafafa"/>
  <text x="40" y="28" font-family="-apple-system,PingFang SC,sans-serif" font-size="14" font-weight="500" fill="#222">Fig 8 Inner/outer profiles (diagram)</text>
  <text x="640" y="28" text-anchor="end" font-family="-apple-system,sans-serif" font-size="11" fill="#888">Diagram · not a screenshot</text>
  
  <rect x="140" y="60" width="300" height="220" fill="none" stroke="#1a73e8" stroke-width="3"/>
  <text x="290" y="50" text-anchor="middle" font-size="12" fill="#1a73e8">Outer (outermost)</text>
  <circle cx="230" cy="150" r="40" fill="none" stroke="#0d904f" stroke-width="2.5"/>
  <rect x="310" y="120" width="70" height="60" fill="none" stroke="#0d904f" stroke-width="2.5"/>
  <text x="230" y="155" text-anchor="middle" font-size="11" fill="#0d904f">Inner</text>
  <text x="345" y="155" text-anchor="middle" font-size="11" fill="#0d904f">Inner</text>
  <text x="40" y="330" font-size="12">Rule: outermost=outer; next=inner. Usually cut inner first, outer last.</text>
  <text x="40" y="360" font-size="12">Offset and lead sides depend on this. Misclassification swaps part and scrap.</text>

