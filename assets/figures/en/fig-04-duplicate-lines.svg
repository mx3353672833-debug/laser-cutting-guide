<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420">
  <rect width="680" height="420" fill="#fafafa"/>
  <text x="40" y="28" font-family="-apple-system,PingFang SC,sans-serif" font-size="14" font-weight="500" fill="#222">Fig 4 Duplicate lines (diagram)</text>
  <text x="640" y="28" text-anchor="end" font-family="-apple-system,sans-serif" font-size="11" fill="#888">Diagram · not a screenshot</text>
  
  <text x="40" y="55" font-size="12">Two fully collinear duplicates</text>
  <line x1="60" y1="100" x2="300" y2="100" stroke="#1a73e8" stroke-width="4" opacity="0.5"/>
  <line x1="60" y1="104" x2="300" y2="104" stroke="#d93025" stroke-width="3" opacity="0.7"/>
  <text x="180" y="90" text-anchor="middle" font-size="11">Blue and red nearly coincide = duplicate</text>
  <text x="40" y="180" font-size="12">Result: path cut twice — burn, oversize, double time.</text>
  <text x="40" y="215" font-size="12">Fix: deduplicate on import or delete one; keep a backup first.</text>
  <rect x="40" y="250" width="600" height="60" rx="8" fill="#fff8e1" stroke="#f9ab00"/>
  <text x="60" y="275" font-size="12" fill="#5f4b00">Note: merge ≠ dedupe. Merge joins gaps; dedupe removes overlap.</text>
  <text x="60" y="295" font-size="12" fill="#5f4b00">If tiny entities vanish: backup, read the tiny-delete threshold, then adjust.</text>

</svg>
