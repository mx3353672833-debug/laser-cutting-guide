<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 420" width="680" height="420">
  <rect width="680" height="420" fill="#fafafa"/>
  <text x="40" y="28" font-family="-apple-system,PingFang SC,sans-serif" font-size="14" font-weight="500" fill="#222">Fig 11 Simulate / dry run / cut (diagram)</text>
  <text x="640" y="28" text-anchor="end" font-family="-apple-system,sans-serif" font-size="11" fill="#888">Diagram · not a screenshot</text>
  
  <rect x="40" y="60" width="180" height="140" rx="8" fill="#e8f0fe" stroke="#4285f4"/>
  <text x="130" y="100" text-anchor="middle" font-size="13" fill="#174ea6">Software simulate</text>
  <text x="130" y="130" text-anchor="middle" font-size="11">Screen display only</text>
  <text x="130" y="150" text-anchor="middle" font-size="11">Order and toolpath</text>
  <text x="130" y="175" text-anchor="middle" font-size="11">No motion commands</text>
  <rect x="250" y="60" width="180" height="140" rx="8" fill="#fef7e0" stroke="#f9ab00"/>
  <text x="340" y="100" text-anchor="middle" font-size="13" fill="#b06000">Machine dry run</text>
  <text x="340" y="130" text-anchor="middle" font-size="11">Machine really moves</text>
  <text x="340" y="150" text-anchor="middle" font-size="11">Gas / laser / PLC off</text>
  <text x="340" y="175" text-anchor="middle" font-size="11">(Dry Run / Frame)</text>
  <rect x="460" y="60" width="180" height="140" rx="8" fill="#fce8e6" stroke="#ea4335"/>
  <text x="550" y="100" text-anchor="middle" font-size="13" fill="#c5221f">Beam-on cut</text>
  <text x="550" y="130" text-anchor="middle" font-size="11">Laser + gas + motion</text>
  <text x="550" y="150" text-anchor="middle" font-size="11">Makes kerf and heat</text>
  <text x="550" y="175" text-anchor="middle" font-size="11">Checks + supervision required</text>
  <text x="40" y="250" font-size="12">Risk levels differ. New users confuse simulate-done with ready-to-cut.</text>
  <text x="40" y="285" font-size="12">Frame=box; Border=outer; Dry Run=full path. Machine work needs SOP + supervision.</text>
  <text x="40" y="330" font-size="11" fill="#888">Concept from CypCut Precheck/Toolpath tutorials (diagram)</text>

</svg>
